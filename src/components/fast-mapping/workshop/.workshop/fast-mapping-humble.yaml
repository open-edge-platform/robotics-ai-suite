name: fast-mapping-humble
base: ubuntu@22.04
sdks:
  - name: project-proxy
  - name: project-robotics-ai-suite
actions:
  # Documented tutorial: FastMapping + RViz2 on the bag bundled with the package; needs the desktop plug.
  bag-replay: |
    python3 -c 'import ctypes as c, os; x = c.CDLL("libX11.so.6"); x.XOpenDisplay.restype = c.c_void_p; exit(not x.XOpenDisplay(os.environ.get("DISPLAY", "").encode()))' || { echo "Cannot open X display '${DISPLAY:-unset}'. Reconnect the desktop plug: workshop disconnect $(hostname)/robotics-ai-suite:desktop; workshop connect $(hostname)/robotics-ai-suite:desktop"; false; }
    source /opt/ros/*/setup.bash
    QT_QPA_PLATFORM=xcb ros2 launch fast_mapping fast_mapping.launch.py
  # Same node and bag without RViz; reports the 3D voxel map and 2D occupancy grid it builds.
  bag-replay-headless: |
    source /opt/ros/*/setup.bash
    pkill -9 -x fast_mapping_no || true
    /opt/ros/$ROS_DISTRO/lib/fast_mapping/fast_mapping_node > /tmp/fast_mapping_node.log 2>&1 &
    sleep 3
    ros2 bag play /opt/ros/$ROS_DISTRO/share/bagfiles/spinning > /tmp/fast_mapping_bag.log 2>&1 &
    python3 - <<'EOF'
    import time
    import rclpy
    from rclpy.qos import QoSProfile, DurabilityPolicy
    from nav_msgs.msg import OccupancyGrid
    from visualization_msgs.msg import MarkerArray
    rclpy.init()
    node = rclpy.create_node("fast_mapping_check")
    qos = QoSProfile(depth=1, durability=DurabilityPolicy.TRANSIENT_LOCAL)
    got = {"fused": 0, "grid": 0}
    def on_fused(m):
        got["fused"] += 1
        got["voxels"] = sum(len(k.points) for k in m.markers)
    def on_grid(m):
        got["grid"] += 1
        got["cells"] = (m.info.width, m.info.height, m.info.resolution, sum(1 for c in m.data if c >= 0))
    node.create_subscription(MarkerArray, "/world/fused_map", on_fused, qos)
    node.create_subscription(OccupancyGrid, "/world/map", on_grid, qos)
    end = time.time() + 16  # bag is ~12 s
    while time.time() < end:
        rclpy.spin_once(node, timeout_sec=0.1)
    print(f"/world/fused_map: {got['fused']} updates, {got.get('voxels', 0)} voxels in last")
    w, h, r, known = got.get("cells", (0, 0, 0.0, 0))
    print(f"/world/map: {got['grid']} updates, {w}x{h} cells @ {r:.3f} m, {known} known cells")
    rclpy.shutdown()
    EOF
    grep "Processed" /tmp/fast_mapping_node.log | tail -1 || true
    wait %2 2>/dev/null || true
    # fast_mapping_node ignores SIGINT/SIGTERM
    pkill -9 -x fast_mapping_no || true
