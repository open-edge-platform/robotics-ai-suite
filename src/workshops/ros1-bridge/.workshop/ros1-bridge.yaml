name: ros1-bridge
base: ubuntu@20.04
sdks:
  - name: project-proxy
  - name: project-ros1-bridge
actions:
  # Usage: bridge-detect [width] [height] [hz] [seconds] [rmw]. ROS 1 camera -> ros1_bridge -> ROS 2 domain 42 and back.
  # Needs the ros1-detector workshop's detect action running and /project/frames/<width>x<height>.raw.
  bridge-detect: |
    W=${1:-640} H=${2:-480}
    source /opt/ros/noetic/setup.bash
    export ROS_IP=$(ip -4 -o addr show eth0 | awk '{print $4}' | cut -d/ -f1)
    roscore > /tmp/roscore.log 2>&1 &
    sleep 5
    # dynamic_bridge crashes on Jazzy nodes' graph info; parameter_bridge bridges a fixed topic list.
    rosparam set /topics '[{topic: /ros1/image, type: sensor_msgs/msg/Image, queue_size: 2}, {topic: /ros1/detections, type: std_msgs/msg/String, queue_size: 10}]'
    (source /opt/ros/foxy/setup.bash; export RMW_IMPLEMENTATION=${5:-rmw_cyclonedds_cpp} ROS_DOMAIN_ID=42
     exec ros2 run ros1_bridge parameter_bridge > /tmp/bridge.log 2>&1) &
    sleep 4
    python3 /project/ros1_camera.py /project/frames/${W}x${H}.raw $W $H ${3:-10} ${4:-30} && RC=0 || RC=$?
    pkill -INT -f "[p]arameter_bridge" || true; pkill -INT -f "[r]osmaster" || true; sleep 2
    pkill -9 -f "[p]arameter_bridge|[r]osmaster|[r]osout" || true
    (exit $RC)
