name: realsense-humble
base: ubuntu@22.04
sdks:
  - name: project-proxy
  - name: project-robotics-ai-suite
  - name: project-camera
actions:
  # Which RealSense cameras the container sees, and the camera_type to use.
  find-cameras: |
    source /opt/ros/*/setup.bash
    ls -l /dev/video* /dev/media* 2>&1 || true
    /opt/ros/$ROS_DISTRO/lib/realsense2_tutorial/find_cameras.sh
    rs-enumerate-devices -s 2>&1 || true
  # Documented tutorial: live camera driver + RViz2 (desktop plug). Optional argument: usb (default) or gmsl. Ctrl+C to stop.
  tutorial: |
    python3 -c 'import ctypes as c, os; x = c.CDLL("libX11.so.6"); x.XOpenDisplay.restype = c.c_void_p; exit(not x.XOpenDisplay(os.environ.get("DISPLAY", "").encode()))' || { echo "Cannot open X display '${DISPLAY:-unset}'. Reconnect the desktop plug: workshop disconnect $(hostname)/robotics-ai-suite:desktop; workshop connect $(hostname)/robotics-ai-suite:desktop"; false; }
    source /opt/ros/*/setup.bash
    ros2 launch realsense2_tutorial realsense2_tutorial.launch.py camera_type:=${1:-usb}
  # Headless: the tutorial's USB driver arguments without RViz; PASS if color, depth and aligned depth stream >= 10 Hz.
  tutorial-check: |
    source /opt/ros/*/setup.bash
    ros2 launch realsense2_camera rs_launch.py align_depth.enable:=true camera_namespace:=/ \
      config_file:=/opt/ros/$ROS_DISTRO/share/realsense2_tutorial/config/image_transport_overrides.yaml > /tmp/realsense_launch.log 2>&1 &
    sleep 10
    grep -h -m1 "Device with name" /tmp/realsense_launch.log | sed 's/.*\]: //' || true
    python3 /project/realsense_check.py 10 && RC=0 || RC=$?
    pkill -INT -f "[r]ealsense2_camera_node" || true; pkill -INT -x ros2 || true; sleep 3
    pkill -9 -f "[r]ealsense2_camera_node" || true; pkill -9 -x ros2 || true
    # A plain `exit` in an action makes `workshop run` return 1.
    (exit $RC)
