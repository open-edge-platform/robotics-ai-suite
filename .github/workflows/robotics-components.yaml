on:
  workflow_call:
    inputs:
      rebuild-all:
        description: 'Whether to force rebuild all components'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  check-changes:
    name: "Checking for changes"
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      adbscan-changed: ${{ steps.filter.outputs.adbscan-location == 'true' || inputs.rebuild-all }}
      collaborative-slam-changed: ${{ steps.filter.outputs.collaborative-slam-location == 'true' || inputs.rebuild-all }}
      fast-mapping-changed: ${{ steps.filter.outputs.fast-mapping-location == 'true' || inputs.rebuild-all }}
      groundfloor-changed: ${{ steps.filter.outputs.groundfloor-location == 'true' || inputs.rebuild-all }}
      its-planner-changed: ${{ steps.filter.outputs.its-planner-location == 'true' || inputs.rebuild-all }}
      multicam-demo-changed: ${{ steps.filter.outputs.multicam-demo-location == 'true' || inputs.rebuild-all }}
      object-detection-changed: ${{ steps.filter.outputs.object-detection-location == 'true' || inputs.rebuild-all }}
      simulations-changed: ${{ steps.filter.outputs.simulations-location == 'true' || inputs.rebuild-all }}
      wandering-changed: ${{ steps.filter.outputs.wandering-location == 'true' || inputs.rebuild-all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/components
      - name: Configure paths to look for changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            adbscan-location:
              - 'src/components/adbscan/**'
            collaborative-slam-location:
              - 'src/components/collaborative-slam/**'
            fast-mapping-location:
              - 'src/components/fast-mapping/**'
            groundfloor-location:
              - 'src/components/groundfloor/**'
            its-planner-location:
              - 'src/components/its-planner/**'
            multicam-demo-location:
              - 'src/components/multicam-demo/**'
            object-detection-location:
              - 'src/components/object-detection/**'
            simulations-location:
              - 'src/components/simulations/**'
            wandering-location:
              - 'src/components/wandering/**'

  adbscan:
    name: "ADBSCAN"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.adbscan-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-adbscan.yaml"

  collaborative-slam:
    name: "Collaborative SLAM"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.collaborative-slam-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-collaborative-slam.yaml"

  fast-mapping:
    name: "Fast Mapping"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.fast-mapping-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-fast-mapping.yaml"

  groundfloor:
    name: "Groundfloor"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.groundfloor-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-groundfloor.yaml"

  its-planner:
    name: "ITS Planner"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.its-planner-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-its-planner.yaml"

  multicam-demo:
    name: "Multi-Camera Demo"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.multicam-demo-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-multicam-demo.yaml"

  object-detection:
    name: "Object Detection"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.object-detection-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-object-detection.yaml"

  simulations:
    name: "Simulations"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.simulations-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-simulations.yaml"

  wandering:
    name: "Wandering"
    needs: check-changes
    if: ${{ needs.check-changes.outputs.wandering-changed == 'true' }}
    uses: "./.github/workflows/robotics-components-wandering.yaml"
