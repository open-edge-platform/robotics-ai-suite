---
# SPDX-FileCopyrightText: (C) 2026 Intel Corporation
# SPDX-License-Identifier: Apache-2.0

name: Deploy Website

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROD_ROLE: arn:aws:iam::153402917730:role/robotics-ai-suite
  PROD_BUCKET: s3://intel-robotics-documentation
  CF_DISTRO: E2MELGJBQJ2G04
  SITE_URL: https://developer.robotics.intel.com

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      - name: Install dependencies
        working-directory: docs/website
        run: npm ci

      - name: Build Sphinx and Docusaurus
        working-directory: docs/website
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && format('/pr/{0}/', github.event.number) || '/' }}
          HF_ORG: ${{ vars.HF_ORG }}
        run: npm run build

      - name: Install browser for website tests
        working-directory: docs/website
        run: npx playwright install --with-deps chromium

      - name: Test website
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && format('/pr/{0}/', github.event.number) || '/' }}
        run: make test-website

      - name: Check PR preview routes
        if: github.event_name == 'pull_request'
        working-directory: docs/website
        env:
          PREVIEW_BASE: /pr/${{ github.event.number }}/
        run: |
          test -s build/index.html
          test -s build/models/index.html
          test ! -e 'build/models/:slug'
          ! grep -Fq '/models/:slug/' build/sitemap.xml
          test -s build/development-stack/ai-suite-robotics/index.html
          test -s build/development-stack/_static/styles/pydata-sphinx-theme.css
          test -s build/search-index.json
          grep -Fq 'href="../_static/styles/pydata-sphinx-theme.css?digest=' build/development-stack/ai-suite-robotics/index.html
          grep -Fq 'href="../_static/css/style_home_section_tiles.css"' build/development-stack/ai-suite-robotics/index.html
          grep -Fq "href=\"${PREVIEW_BASE}models/\"" build/development-stack/ai-suite-robotics/index.html
          grep -Fq "href=\"${PREVIEW_BASE}development-stack/ai-suite-robotics/\"" build/development-stack/ai-suite-robotics/index.html

      - name: Upload website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: website
          path: docs/website/build/
          if-no-files-found: error

  cleanup-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.PROD_ROLE }}
          role-session-name: Github
          aws-region: us-east-1

      - name: Delete PR preview from S3
        run: aws s3 rm "${PROD_BUCKET}/pr/${{ github.event.number }}" --recursive

      - name: Invalidate removed preview
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRO" --paths "/pr/${{ github.event.number }}/*"

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Download website
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: website
          path: site-build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.PROD_ROLE }}
          role-session-name: Github
          aws-region: us-east-1

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        run: |
          aws s3 sync site-build/ "${PROD_BUCKET}/pr/${{ github.event.number }}" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRO" --paths "/pr/${{ github.event.number }}/*"

      - name: Deploy to root
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync site-build/ "$PROD_BUCKET" --delete --exclude "pr/*"
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRO" --paths "/*"

      - name: Comment PR with preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const url = `${{ env.SITE_URL }}/pr/${{ github.event.number }}/index.html`;
            const body = `Preview deployed for commit \`${{ github.event.pull_request.head.sha }}\`\n\n${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('Preview deployed for commit'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
